<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hop Drone Hunt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff2d4a'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<canvas id="view" aria-label="Game view"></canvas>
<canvas id="static" width="160" height="90"></canvas>
<div id="hurt"></div>

<!-- Intro: your pilot on the stand, eyes on the remote -->
<div id="intro" hidden>
  <img id="introImg" alt="">
  <div><div id="introName"></div><div id="introRole"></div><div id="introBrief"></div><div id="keys"></div></div>
</div>

<div id="hud" class="off">
  <div id="tl">
    <div class="sc"><span id="score">0</span><small>PTS</small></div>
    <div id="left"></div>
    <div id="board"></div>
  </div>
  <div id="clock">3:00</div>
  <div id="boss" hidden><b id="bossName"></b><div><i id="bossFill"></i></div></div>
  <div id="hp"><div id="hpBar"><div id="hpFill"></div></div><span id="hpNum">100</span></div>
  <canvas id="minimap" width="170" height="170"></canvas>
  <div id="marks"></div>
  <div id="osd" hidden>
    <div class="osd-l"><span id="osdBatt"></span><span id="osdAlt"></span></div>
    <div class="osd-r"><span id="osdSpeed"></span><span>FPV</span></div>
  </div>
  <div id="incoming">INCOMING</div>
  <div id="prox"></div>
  <div id="tricks"><span id="trick"></span><div><i id="trickBar"></i></div></div>
</div>
<div id="cross" hidden><i></i><i></i><i></i><i></i></div>
<div id="hitmark"></div>
<div id="pop"></div>
<div id="center"></div>
<div id="sub"></div>
<div id="toast"></div>
<div id="wait" hidden></div>

<div id="menu" hidden>
  <div class="panel">
    <h2 id="pickTitle">PICK A COURSE</h2>
    <div class="cards">
      <button type="button" class="card city" data-course="city"><b>City</b><small></small><em></em></button>
      <button type="button" class="card mountain" data-course="mountain"><b>Mountain</b><small></small><em></em></button>
      <button type="button" class="card dunes" data-course="dunes"><b>Dunes</b><small></small><em></em></button>
    </div>
    <p id="padKeys" hidden></p>
  </div>
</div>

<div id="results" hidden>
  <div class="panel">
    <h2><span id="resTitle">FINAL SCORES</span> <small id="resCourse"></small></h2>
    <div id="resBody"></div>
    <div class="btns">
      <div id="resPick">
        <button type="button" class="small" data-course="city"><b>HUNT AGAIN · City</b></button>
        <button type="button" class="small" data-course="mountain"><b>HUNT AGAIN · Mountain</b></button>
        <button type="button" class="small" data-course="dunes"><b>HUNT AGAIN · Dunes</b></button>
      </div>
      <p id="resWait" hidden></p>
      <button type="button" id="endAll" class="quiet" hidden>END GAME FOR EVERYONE</button>
      <button type="button" id="backLobby" class="quiet">BACK TO LOBBY</button>
    </div>
  </div>
</div>

<div id="status"></div>
<div id="debug" hidden></div>
<div id="err" hidden></div>

<script>
  window.addEventListener("error", function (e) {
    var el = document.getElementById("err");
    el.hidden = false;
    el.textContent = "Error: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")";
  });
</script>
<script>
/* The game's scripts, in order. They download in parallel and each one is
   retried if the network drops it; then they run in this order. hoplobby.js is
   an unchanged copy of HopLobby SDK v1, so standalone mode also works offline. */
(function () {
  var FILES = ["hoplobby.js", "vendor/three.min.js", "vendor/GLTFLoader.js", "src/util.js?v=4", "src/track.js?v=4", "src/sim.js?v=4",
    "src/net.js?v=4", "src/world.js?v=4", "src/drone.js?v=4", "src/pilot.js?v=4", "src/view.js?v=4", "src/audio.js?v=4",
    "src/input.js?v=4", "src/hud.js?v=4", "src/main.js?v=4"];
  function fail(src) {
    var el = document.getElementById("err");
    el.hidden = false;
    el.textContent = "Couldn't download " + src.split("?")[0] + ". Check your connection and reload.";
  }
  if (location.protocol === "file:") {
    FILES.forEach(function (src) { document.write('<script src="' + src + '"><\/script>'); });
    return;
  }
  function get(src, attempt) {
    var url = attempt ? src + (src.indexOf("?") < 0 ? "?" : "&") + "retry=" + attempt : src;
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    }).catch(function () {
      if (attempt >= 4) { fail(src); throw new Error("gave up on " + src); }
      return new Promise(function (ok) { setTimeout(ok, 400 * (attempt + 1)); }).then(function () { return get(src, attempt + 1); });
    });
  }
  Promise.all(FILES.map(function (src) { return get(src, 0); })).then(function (texts) {
    texts.forEach(function (text, i) {
      var s = document.createElement("script");
      s.textContent = text + "\n//# sourceURL=" + new URL(FILES[i], location.href).href;
      document.body.appendChild(s);
    });
  }, function () { /* fail() already said which file */ });
})();
</script>
</body>
</html>
